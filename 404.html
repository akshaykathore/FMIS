<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Programming Bubbles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            overflow: hidden;
        }
        .banner {
            position: relative;
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #007bff, #6610f2);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }
        .bubble {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 6s infinite ease-in-out;
        }
        .bubble img {
            width: 40px;
            height: 40px;
        }
        .bubble:nth-child(1) { top: 10%; left: 5%; animation-duration: 7s; }
        .bubble:nth-child(2) { top: 20%; left: 20%; animation-duration: 5s; }
        .bubble:nth-child(3) { bottom: 15%; right: 10%; animation-duration: 6s; }
        .bubble:nth-child(4) { bottom: 20%; left: 40%; animation-duration: 8s; }
        .bubble:nth-child(5) { top: 50%; right: 20%; animation-duration: 7.5s; }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-15px) scale(1.1); }
            100% { transform: translateY(0px) scale(1); }
        }
    </style>
</head>
<body>
    <div class="banner">
        <h2>Learn Software Development</h2>
        <p>Master Python, Java, React, LangChain, and more!</p>
        <div class="bubble">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" alt="Python">
        </div>
        <div class="bubble">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/java/java-original.svg" alt="Java">
        </div>
        <div class="bubble">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" alt="JavaScript">
        </div>
        <div class="bubble">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg" alt="ReactJS">
        </div>
        <div class="bubble">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/angularjs/angularjs-original.svg" alt="Angular">
        </div>
    </div>
</body>
</html>
